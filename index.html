    const playChimeSound = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.1 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + index * 0.1);
          osc.stop(audioCtx.currentTime + index * 0.1 + 0.3);
        });
      } catch (err) {
        console.log("AudioContext blocked", err);
      }
    };

          utterance.lang = 'id-ID';
          utterance.rate = 0.95;
          utterance.pitch = 0.8;
          
          const voices = window.speechSynthesis.getVoices();
          const maleVoice = voices.find(v => v.lang.includes('id') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('indonesia')));
          if (maleVoice) {
            utterance.voice = maleVoice;
          }

      const [cart, setCart] = useState([]);
      const [santriForm, setSantriForm] = useState({ namaPemesan: '', namaSantri: '', kelas: '', rayon: '', waktu: '', selectedPackage: null });
      const [ifthorForm, setIfthorForm] = useState({ wali: '', kelasIfthor: '', pilihanNasiIfthor: 'Nasi Putih', hariTanggal: '', permitFile: null, selectedPackage: null });

      if (!onlineStatus.isOpen) {
        return (
          <div className="max-w-xl mx-auto mt-20 text-center bg-[#141414] border border-red-500/40 p-8 rounded-2xl shadow-2xl">
            <div className="text-red-500 font-bold text-lg mb-2">Pemesanan Online Sedang Ditutup</div>
            <p className="text-sm text-gray-400 mb-4">{onlineStatus.reason || "Mohon maaf, layanan pemesanan online saat ini belum dibuka oleh pengelola."}</p>
            <div className="text-xs text-gray-500 italic">Silakan hubungi kasir outlet secara langsung atau tunggu hingga dibuka kembali.</div>
          </div>
        );
      }

      const addToCart = (item) => {
        const existing = cart.find(c => c.id === item.id);
        if (existing) setCart(cart.map(c => c.id === item.id ? { ...c, qty: c.qty + 1 } : c));
        else setCart([...cart, { ...item, qty: 1 }]);
      };
      const removeOne = (id) => {
        const existing = cart.find(c => c.id === id);
        if (existing && existing.qty > 1) setCart(cart.map(c => c.id === id ? { ...c, qty: c.qty - 1 } : c));
        else setCart(cart.filter(c => c.id !== id));
      };
      
      const currentSelectedPackage = orderType === 'santri' ? santriForm.selectedPackage : ifthorForm.selectedPackage;
      const totalCart = (currentSelectedPackage ? currentSelectedPackage.price : 0) + cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const itemsList = [
        ...(currentSelectedPackage ? [{ name: `${currentSelectedPackage.name} (Paket)`, qty: 1, price: currentSelectedPackage.price, subtotal: currentSelectedPackage.price }] : []),
        ...cart.map(c => ({ name: c.name, qty: c.qty, price: c.price, subtotal: c.price * c.qty }))
      ];
      const cartDetails = itemsList.map(i => `- ${i.name} (${i.qty}x @ Rp ${i.price.toLocaleString('id-ID')}) = Rp ${i.subtotal.toLocaleString('id-ID')}`).join('\n');

      const handleSantriSubmit = (e) => {
        e.preventDefault();
        const orderData = {
          type: 'Pemesanan Santri',
          customer: `Wali: ${santriForm.namaPemesan}\nSantri: ${santriForm.namaSantri}\nKelas: ${santriForm.kelas} | Rayon: ${santriForm.rayon}`,
          santriInfo: { namaSantri: santriForm.namaSantri, kelas: santriForm.kelas, rayon: santriForm.rayon },
          itemsList, details: `Rincian:\n${cartDetails}\nWaktu: ${santriForm.waktu}`,
          payment: paymentMethod, total: totalCart
        };
        onCreateOrder(orderData);
        window.open(generateWaLink({ id: 'ORD-TMP', date: new Date().toLocaleString('id-ID'), ...orderData }), '_blank');
      };

      const handleIfthorSubmit = (e) => {
        e.preventDefault();
        if (!ifthorForm.permitFile) { alert("Harap upload surat izin Ifthor Jama'i."); return; }
        const orderData = {
          type: 'Pemesanan Ifthor Jama\'i',
          dateStr: ifthorForm.hariTanggal,
          customer: `Wali: ${ifthorForm.wali}\nKelas: ${ifthorForm.kelasIfthor}`,
          santriInfo: { namaSantri: `Ifthor (${ifthorForm.wali})`, kelas: ifthorForm.kelasIfthor, rayon: 'Pesantren' },
          itemsList, details: `Nasi: ${ifthorForm.pilihanNasiIfthor}\n${cartDetails}`,
          permitFile: ifthorForm.permitFile, payment: paymentMethod, total: totalCart
        };
        onCreateOrder(orderData);
        window.open(generateWaLink({ id: 'ORD-TMP', date: new Date().toLocaleString('id-ID'), ...orderData }), '_blank');
      };

      return (
        <div className="max-w-7xl mx-auto flex flex-col xl:flex-row gap-8">
          <div className="flex-[1.6]">
            <div className="bg-[#141414] border border-[#D4AF37]/30 rounded-xl p-6">
              <h2 className="text-2xl font-serif font-bold text-[#D4AF37] mb-4 text-center">Menu La-Tansa</h2>
              <div className="space-y-6 max-h-[600px] overflow-y-auto pr-2">
                <div>
                  <h3 className="text-xs font-bold text-[#D4AF37] uppercase mb-3">Paket Cepat</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {packages.map(pkg => (
                      <div key={pkg.id} onClick={() => {
                        const sel = orderType === 'santri' ? santriForm.selectedPackage : ifthorForm.selectedPackage;
                        if (orderType === 'santri') setSantriForm({...santriForm, selectedPackage: sel?.id === pkg.id ? null : pkg});
                        else setIfthorForm({...ifthorForm, selectedPackage: sel?.id === pkg.id ? null : pkg});
                      }} className={`p-3 rounded-xl border cursor-pointer flex gap-3 items-center ${(orderType === 'santri' ? santriForm.selectedPackage?.id : ifthorForm.selectedPackage?.id) === pkg.id ? 'border-[#D4AF37] bg-[#D4AF37]/10' : 'border-gray-800 bg-[#1A1A1A]'}`}>
                        <img src={getImgUrl(pkg)} alt={pkg.name} className="w-12 h-12 rounded object-cover" />
                        <div className="flex-1">
                          <div className="flex justify-between text-xs font-bold text-white"><span>{pkg.name}</span><span className="text-[#D4AF37]">Rp {pkg.price.toLocaleString('id-ID')}</span></div>
                          <p className="text-[10px] text-gray-400">{pkg.description}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
                <div>
                  <h3 className="text-xs font-bold text-[#D4AF37] uppercase mb-3">Menu Satuan</h3>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {menuItems.map(item => {
                      const qty = cart.find(c => c.id === item.id)?.qty || 0;
                      return (
                        <div key={item.id} className="bg-[#1A1A1A] border border-gray-800 rounded-xl p-3 flex flex-col justify-between">
                          <img src={getImgUrl(item)} alt={item.name} className="w-full h-20 object-cover rounded mb-2" />
                          <div className="text-xs font-bold text-white mb-1">{item.name}</div>
                          <div className="flex justify-between items-center mt-auto">
                            <span className="text-xs text-[#D4AF37] font-bold">Rp {item.price.toLocaleString('id-ID')}</span>
                            {qty > 0 ? (
                              <div className="flex items-center gap-1 bg-black px-2 py-1 rounded border border-[#D4AF37]/30">
                                <button onClick={() => removeOne(item.id)}><Minus size={12}/></button>
                                <span className="text-xs">{qty}</span>
                                <button onClick={() => addToCart(item)}><Plus size={12}/></button>
                              </div>
                            ) : (
                              <button onClick={() => addToCart(item)} className="px-2.5 py-1 bg-[#D4AF37] text-black text-xs font-bold rounded cursor-pointer">+ Pesan</button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className="flex-[1.2]">
            <div className="flex justify-center gap-2 mb-4">
              <button onClick={() => setOrderType('santri')} className={`px-4 py-2 rounded text-xs font-bold cursor-pointer ${orderType === 'santri' ? 'bg-[#D4AF37] text-black' : 'bg-[#141414] text-gray-400'}`}>Pemesanan Santri</button>
              <button onClick={() => setOrderType('ifthor')} className={`px-4 py-2 rounded text-xs font-bold cursor-pointer ${orderType === 'ifthor' ? 'bg-[#D4AF37] text-black' : 'bg-[#141414] text-gray-400'}`}>Ifthor Jama'i</button>
            </div>

            <div className={cardClass}>
              <h3 className="text-xl font-serif font-bold text-[#D4AF37] mb-4">{orderType === 'santri' ? 'Formulir Santri' : 'Formulir Ifthor Jama\'i'}</h3>
              <form onSubmit={orderType === 'santri' ? handleSantriSubmit : handleIfthorSubmit} className="space-y-4">
                {orderType === 'santri' ? (
                  <>
                    <input type="text" required placeholder="Nama Pemesan (Wali)" value={santriForm.namaPemesan} onChange={e => setSantriForm({...santriForm, namaPemesan: e.target.value})} className={inputClass} />
                    <input type="text" required placeholder="Nama Santri" value={santriForm.santriInfo?.namaSantri || santriForm.namaSantri} onChange={e => setSantriForm({...santriForm, namaSantri: e.target.value})} className={inputClass} />
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" required placeholder="Kelas" value={santriForm.kelas} onChange={e => setSantriForm({...santriForm, kelas: e.target.value})} className={inputClass} />
                      <input type="text" required placeholder="Rayon / Asrama" value={santriForm.rayon} onChange={e => setSantriForm({...santriForm, rayon: e.target.value})} className={inputClass} />
                    </div>
                    <input type="text" required placeholder="Waktu Pengambilan (Misal: 16.00 WIB)" value={santriForm.waktu} onChange={e => setSantriForm({...santriForm, waktu: e.target.value})} className={inputClass} />
                  </>
                ) : (
                  <>
                    <input type="text" required placeholder="Nama Wali Kelas (Pemesan)" value={ifthorForm.wali} onChange={e => setIfthorForm({...ifthorForm, wali: e.target.value})} className={inputClass} />
                    <input type="text" required placeholder="Kelas yang Mengikuti" value={ifthorForm.kelasIfthor} onChange={e => setIfthorForm({...ifthorForm, kelasIfthor: e.target.value})} className={inputClass} />
                    <input type="date" required value={ifthorForm.hariTanggal} onChange={e => setIfthorForm({...ifthorForm, hariTanggal: e.target.value})} className={inputClass} />
                    <div>
                      <label className="text-xs text-gray-400 mb-1 block">Upload Surat Izin Ifthor Jama'i (Gambar/PDF)</label>
                      <input type="file" accept="image/*,application/pdf" required onChange={e => {
                        const file = e.target.files[0];
                        if (file) { const r = new FileReader(); r.onloadend = () => setIfthorForm({...ifthorForm, permitFile: r.result}); r.readAsDataURL(file); }
                      }} className="text-xs text-gray-400 w-full p-2 bg-[#1A1A1A] border border-gray-800 rounded" />
                    </div>
                  </>
                )}

                <div className="pt-4 border-t border-gray-800 flex justify-between items-center">
                  <span className="font-bold">Total: Rp {totalCart.toLocaleString('id-ID')}</span>
                  <button type="submit" className={btnClass}>Kirim Pesanan</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    function POSKasir({ menuItems, onCreateOrder, btnClass, cardClass, posStatus }) {
      const [cart, setCart] = useState([]);
      if (!posStatus.isOpen) {
        return (
          <div className="max-w-xl mx-auto mt-20 text-center bg-[#141414] border border-red-500/40 p-8 rounded-2xl shadow-2xl">
            <div className="text-red-500 font-bold text-lg mb-2">Kasir POS Sedang Ditutup</div>
            <p className="text-sm text-gray-400">{posStatus.reason || "Outlet kasir saat ini tidak beroperasi."}</p>
          </div>
        );
      }
      const addToCart = (item) => setCart(cart.find(c => c.id === item.id) ? cart.map(c => c.id === item.id ? {...c, qty: c.qty + 1} : c) : [...cart, {...item, qty: 1}]);
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      return (
        <div className="flex gap-6">
          <div className="flex-1 grid grid-cols-3 gap-3 h-fit">
            {menuItems.map(item => (
              <div key={item.id} onClick={() => addToCart(item)} className="bg-[#141414] p-3 rounded-xl border border-gray-800 cursor-pointer hover:border-[#D4AF37]">
                <div className="text-xs font-bold text-white mb-1">{item.name}</div>
                <div className="text-xs text-[#D4AF37]">Rp {item.price.toLocaleString('id-ID')}</div>
              </div>
            ))}
          </div>
          <div className={`${cardClass} w-80 flex flex-col`}>
            <h3 className="font-bold text-[#D4AF37] mb-4">Kasir POS</h3>
            <div className="flex-1 overflow-y-auto space-y-2 mb-4 max-h-60">
              {cart.map(c => <div key={c.id} className="flex justify-between text-xs"><span>{c.name} ({c.qty}x)</span><span>Rp {(c.price*c.qty).toLocaleString('id-ID')}</span></div>)}
            </div>
            <div className="border-t border-gray-800 pt-3">
              <div className="flex justify-between font-bold mb-4"><span>Total:</span><span>Rp {total.toLocaleString('id-ID')}</span></div>
              <button onClick={() => { onCreateOrder({ type: 'Transaksi Outlet Kasir', customer: 'Umum', itemsList: cart, details: 'POS', payment: 'Cash', total }); setCart([]); }} className={`${btnClass} w-full`}>Bayar Tunai</button>
            </div>
          </div>
        </div>
      );
    }

    function AdminDashboard({ orders, transactions, menuItems, onlineStatus, setOnlineStatus, posStatus, setPosStatus }) {
      const [reasonOnline, setReasonOnline] = useState(onlineStatus.reason);
      const [reasonPos, setReasonPos] = useState(posStatus.reason);

      return (
        <div className="space-y-6">
          <h3 className="text-xl font-serif font-bold text-[#D4AF37]">Dasbor Admin & Pengaturan</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-[#141414] p-6 rounded-xl border border-gray-800">
              <h4 className="font-bold text-[#D4AF37] mb-2">Status Pemesanan Online</h4>
              <div className="space-y-3">
                <button onClick={() => setOnlineStatus({ isOpen: !onlineStatus.isOpen, reason: reasonOnline })} className={`w-full py-2 rounded font-bold text-xs cursor-pointer ${onlineStatus.isOpen ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}`}>
                  {onlineStatus.isOpen ? 'ONLINE (BUKA)' : 'TUTUP'}
                </button>
                {!onlineStatus.isOpen && <input type="text" placeholder="Keterangan tutup..." value={reasonOnline} onChange={e => { setReasonOnline(e.target.value); setOnlineStatus({isOpen: false, reason: e.target.value}); }} className="w-full p-2 bg-black border border-gray-800 rounded text-xs text-white" />}
              </div>
            </div>

            <div className="bg-[#141414] p-6 rounded-xl border border-gray-800">
              <h4 className="font-bold text-[#D4AF37] mb-2">Status Kasir POS</h4>
              <div className="space-y-3">
                <button onClick={() => setPosStatus({ isOpen: !posStatus.isOpen, reason: reasonPos })} className={`w-full py-2 rounded font-bold text-xs cursor-pointer ${posStatus.isOpen ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}`}>
                  {posStatus.isOpen ? 'KASIR BUKA' : 'KASIR TUTUP'}
                </button>
                {!posStatus.isOpen && <input type="text" placeholder="Keterangan kasir tutup..." value={reasonPos} onChange={e => { setReasonPos(e.target.value); setPosStatus({isOpen: false, reason: e.target.value}); }} className="w-full p-2 bg-black border border-gray-800 rounded text-xs text-white" />}
              </div>
            </div>
          </div>

          <div className="bg-[#141414] p-6 rounded-xl border border-gray-800">
            <h4 className="font-bold mb-4">Riwayat Pesanan ({orders.length})</h4>
            <div className="space-y-2 max-h-60 overflow-y-auto">
              {orders.map(o => <div key={o.id} className="p-3 bg-black rounded border border-gray-800 text-xs flex justify-between"><span>{o.id} - {o.type} ({o.customer})</span><span className="font-bold text-[#D4AF37]">Rp {o.total.toLocaleString('id-ID')}</span></div>)}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
